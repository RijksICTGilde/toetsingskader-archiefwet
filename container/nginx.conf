worker_processes 1;
pid /tmp/nginx.pid;

# Expliciet naar stdout/stderr, niet via het default-logpad: `apk upgrade` kan
# nginx vervangen door de Alpine-build met prefix /var/lib/nginx, en die map is
# 0750 van uid 101. ZAD draait de pod met een willekeurige UID, dus dan faalt
# het openen van de logs en start nginx niet op.
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Achter een reverse proxy: geen absolute redirects, anders lekt de interne
    # hostname/poort.
    absolute_redirect off;

    # Schrijfbare temp-paden voor non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Verberg nginx-versie in Server-header en error-pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (basis overgenomen van ghcr.io/rijksictgilde/nginx-base).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Schakel privacy-gevoelige browser-APIs expliciet uit.
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Strikte CSP: alles via 'self', data: voor inline SVG-icons.
        # frame-ancestors 'none' dekt X-Frame-Options.
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

        # RFC 9116: meldpunt, gedelegeerd naar het NCSC-kanaal.
        location = /.well-known/security.txt {
            return 301 https://www.ncsc.nl/.well-known/security.txt;
        }

        location / {
            try_files $uri $uri/index.html $uri/ =404;

            # HTML mag niet blind uit de browsercache komen. Zonder
            # Cache-Control verzint de browser zelf een houdbaarheid op basis
            # van Last-Modified, en dan zie je na een deploy nog de vorige
            # pagina tot je ververst. `expires -1` zet Cache-Control: no-cache:
            # de browser mag het antwoord bewaren, maar moet het elke keer
            # laten bevestigen. Dat kost een 304 en levert altijd de laatste
            # versie op. De assets hieronder houden hun jaar cache; die hebben
            # een fingerprint in de bestandsnaam.
            #
            # Bewust `expires` en geen `add_header`: een add_header hier zou de
            # add_headers van serverniveau (CSP, HSTS, X-Frame-Options, …) voor
            # deze location laten vervallen. nginx erft die alleen zolang het
            # huidige niveau zélf geen add_header heeft.
            expires -1;
        }

        error_page 404 /404.html;

        # Lange cache voor statische assets met fingerprint-naam.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";

            # Deze location zet zelf add_headers, dus vervallen álle
            # add_headers van serverniveau (nginx erft ze alleen zolang het
            # huidige niveau er geen enkele zet — vervangen, niet samenvoegen).
            # Ze staan hier daarom voluit herhaald. Zonder deze regels gaat elk
            # JS-, CSS-, font- en afbeeldingsantwoord de deur uit zonder CSP en
            # HSTS, en is een los opgevraagde SVG door elke origin te framen.
            # LET OP: houd dit blok gelijk aan het serverniveau hierboven.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
        }
    }
}
