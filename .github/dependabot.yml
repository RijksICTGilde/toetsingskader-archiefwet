version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly

  # Het theme als Hugo Module; tools.go houdt de require in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
