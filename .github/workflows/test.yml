name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Laatste release staat in CHANGELOG.md
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then echo "Nog geen release-tag."; exit 0; fi
          echo "Laatste release: ${tag}"
          node scripts/release.mjs --notes "${tag#v}" > /dev/null

  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
      HTMLTEST_VERSION: 0.17.0
      HTMLTEST_SHA256: 775c597ee74899d6002cd2d93076f897f4ba68686bceabe2e5d72e84c57bc0fb
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install htmltest
        run: |
          curl -sLJO "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HTMLTEST_SHA256}  htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/htmltest"
          tar -C "${HOME}/.local/htmltest" -xf "htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          rm "htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HOME}/.local/htmltest" >> "${GITHUB_PATH}"

      - name: Verify installations
        run: |
          hugo version
          htmltest --version

      - name: Determine version from git tag
        # Alleen een echte tag exporteren; geen tag → hugo.yaml-default (geen hash).
        run: |
          V="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$V" ]; then echo "HUGO_PARAMS_VERSION=$V" >> "$GITHUB_ENV"; fi

      - name: Build site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --gc --minify --logLevel warning

      - name: Theme-pin onveranderd
        # Zonder require in go.mod haalt Hugo stil de nieuwste theme-versie op.
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Unittests (projecteigen a11y-controles)
        run: |
          npm ci
          npm test

      - name: Toegankelijkheidsscan (axe-core)
        # Draait ná de Hugo-build over public/. Faalt bij elke WCAG-overtreding
        # die axe kan vaststellen; layout-afhankelijke regels (contrast, doelgrootte)
        # zitten er niet in — zie docs/toegankelijkheidsonderzoek-2026-08.md.
        run: npm run test:a11y

      - name: Toegankelijkheidsscan in de browser (axe + reflow/zoom/focus)
        # Wat jsdom niet kan: contrast, doelgrootte, reflow op 320px,
        # tekstvergroting tot 200%, tekstafstand en echte toetsenbordfocus.
        # Bouwt apart met `--baseURL /`, anders verwijzen CSS en JS naar het
        # productiedomein en meet je een pagina zonder stylesheet.
        run: |
          npx playwright install --with-deps chromium
          hugo --minify --quiet --baseURL / --destination .a11y/public
          npm run test:a11y:browser

      - name: Zoeken in de browser
        # Gebruikt de build en Chromium van de stap hiervoor.
        run: npm run test:zoeken

      - name: PDF's genereren en de markers controleren
        # pdfkit in Node (scripts/pdf-tagged.mjs) — geen browser nodig.
        # pdf-ua-check meet daarna op de ruwe bytes of /StructTreeRoot,
        # /MarkInfo, /Lang en /DisplayDocTitle er echt in staan én of de
        # structuurboom gevuld is (/H1, /LBody). Dit is het acceptatiecriterium
        # uit docs/besluit-toegankelijke-pdf.md (§7, aangescherpt in §11).
        run: |
          npm run build:pdf
          npm run test:pdf-ua

      - name: PDF/UA-1-validatie (veraPDF)
        # De hele norm voor zover machinaal te toetsen, bovenop de markers
        # hierboven; faalt bij elke mislukte controle in elk van de negen PDF's.
        # Image op digest. Dependabot ziet geen image in een run-regel, dus
        # tag en digest met de hand bijwerken (`podman manifest inspect`).
        # De repo op hetzelfde pad in de container, zodat de bestandsnamen in
        # het rapport kloppen.
        env:
          VERAPDF: >-
            docker run --rm -v ${{ github.workspace }}:${{ github.workspace }}:ro -w ${{ github.workspace }}
            docker.io/verapdf/cli:v1.30.4@sha256:c2ac9448973a56acd833c81441e38d2dca58ea26a2ce1621e9a32e85d3d2728f
        run: npm run test:pdf-verapdf

      - name: PDF's bewaren
        # Vier markers is een ondergrens, geen conformiteitsverklaring: of de
        # tags de inhoud kloppend beschrijven vraagt een doorloop met PAC of
        # Acrobat. Daarvoor moeten de bestanden te downloaden zijn. `always()`,
        # want juist een PDF die de controle niet haalt wil je bekijken.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-export
          path: public/normen/**/index.pdf
          if-no-files-found: warn

      - name: Test links
        # htmltest bouwt zijn eigen kopie van de site. De PDF's uit de stap
        # hierboven moeten mee, want de downloadknop linkt er rechtstreeks naar
        # en een ontbrekend bestand is voor htmltest een gebroken link. De
        # print-HTML gaat er juist uit: dat is invoer voor de PDF en zou elke
        # externe bron een tweede keer laten controleren.
        run: |
          hugo --minify --quiet --baseURL / --destination .htmltest/public
          (cd public && find . -name index.pdf -exec cp --parents {} ../.htmltest/public/ \;)
          find .htmltest/public -name index.pdfdata.json -delete
          htmltest
