name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
      HTMLTEST_VERSION: 0.17.0
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install htmltest
        run: |
          curl -sLJO "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${HOME}/.local/htmltest"
          tar -C "${HOME}/.local/htmltest" -xf "htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          rm "htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HOME}/.local/htmltest" >> "${GITHUB_PATH}"

      - name: Verify installations
        run: |
          hugo version
          htmltest --version

      - name: Determine version from git tag
        # Alleen een echte tag exporteren; geen tag → hugo.yaml-default (geen hash).
        run: |
          V="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$V" ]; then echo "HUGO_PARAMS_VERSIE=$V" >> "$GITHUB_ENV"; fi

      - name: Build site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --gc --minify --logLevel warning

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unittests (projecteigen a11y-controles)
        run: |
          npm ci
          npm test

      - name: Toegankelijkheidsscan (axe-core)
        # Draait ná de Hugo-build over public/. Faalt bij elke WCAG-overtreding
        # die axe kan vaststellen; layout-afhankelijke regels (contrast, doelgrootte)
        # zitten er niet in — zie docs/toegankelijkheidsonderzoek-2026-08.md.
        run: npm run test:a11y

      - name: Toegankelijkheidsscan in de browser (axe + reflow/zoom/focus)
        # Wat jsdom niet kan: contrast, doelgrootte, reflow op 320px,
        # tekstvergroting tot 200%, tekstafstand en echte toetsenbordfocus.
        # Bouwt apart met `--baseURL /`, anders verwijzen CSS en JS naar het
        # productiedomein en meet je een pagina zonder stylesheet.
        run: |
          npx playwright install --with-deps chromium
          hugo --minify --quiet --baseURL / --destination .a11y/public
          npm run test:a11y:browser

      - name: PDF's genereren en de markers controleren
        # pdfkit in Node (scripts/pdf-tagged.mjs) — geen browser nodig.
        # pdf-ua-check meet daarna op de ruwe bytes of /StructTreeRoot,
        # /MarkInfo, /Lang en /DisplayDocTitle er echt in staan én of de
        # structuurboom gevuld is (/H1, /LBody). Dit is het acceptatiecriterium
        # uit docs/besluit-toegankelijke-pdf.md (§7, aangescherpt in §11).
        run: |
          npm run build:pdf
          npm run test:pdf-ua

      - name: PDF's bewaren
        # Vier markers is een ondergrens, geen conformiteitsverklaring: of de
        # tags de inhoud kloppend beschrijven vraagt een doorloop met PAC of
        # Acrobat. Daarvoor moeten de bestanden te downloaden zijn. `always()`,
        # want juist een PDF die de controle niet haalt wil je bekijken.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-export
          path: public/normen/**/index.pdf
          if-no-files-found: warn

      - name: Test links
        # htmltest bouwt zijn eigen kopie van de site. De PDF's uit de stap
        # hierboven moeten mee, want de downloadknop linkt er rechtstreeks naar
        # en een ontbrekend bestand is voor htmltest een gebroken link. De
        # print-HTML gaat er juist uit: dat is invoer voor de PDF en zou elke
        # externe bron een tweede keer laten controleren.
        run: |
          hugo --minify --quiet --baseURL / --destination .htmltest/public
          (cd public && find . -name index.pdf -exec cp --parents {} ../.htmltest/public/ \;)
          find .htmltest/public -name index.pdfdata.json -delete
          htmltest
