name: Deploy to ZAD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/rijksictgilde/toetsingskader-archiefwet

jobs:
  build:
    if: github.event.action != 'closed' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine BASE_URL for build
        id: baseurl
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            echo "value=https://frontend-pr-${PR}-toets-hn7.rig.prd1.gn2.quattro.rijksapps.nl/archiefwet/" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version from release tag
        id: versie
        # Bij een release: de tag van de release. Anders de laatste tag; leeg
        # als er (nog) geen tag is, zodat de Containerfile terugvalt op de
        # leesbare default uit hugo.yaml (geen kale commit-hash als "versie").
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$RELEASE_TAG"
          if [ -z "$V" ]; then V="$(git describe --tags --abbrev=0 2>/dev/null || true)"; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=${{ steps.baseurl.outputs.value }}
            VERSIE=${{ steps.versie.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # De build-stage (Go + Hugo) mag uit de cache; de runtime-stage niet,
          # anders is `apk upgrade` in de Containerfile een gecachte laag met
          # de openssl van weken terug en wordt Trivy rood op een CVE die
          # Alpine al gefixt heeft.
          no-cache-filters: runtime

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.user.type != 'Bot'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@0b604742a137d43f6fe8fceb06bdffeb0a1665db # v4.4.1
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: toets-hn7
          deployment-name: pr-${{ github.event.pull_request.number }}
          component: frontend
          image: ${{ needs.build.outputs.image }}
          clone-from: production
          comment-on-pr: true
          wait-for-ready: true

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      packages: write
      pull-requests: write
    steps:
      - name: Cleanup ZAD deployment
        uses: RijksICTGilde/zad-actions/cleanup@0b604742a137d43f6fe8fceb06bdffeb0a1665db # v4.4.1
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: toets-hn7
          deployment-name: pr-${{ github.event.pull_request.number }}
          delete-github-env: 'true'
          delete-github-deployments: 'true'
          delete-pr-comment: 'true'

      - name: Delete container images for this PR
        shell: bash
        # Opruimen van oude preview-images mag een merge niet rood maken.
        continue-on-error: true
        env:
          # De token van de workflow zelf: hangt niet aan een persoon en verloopt
          # niet. Mag images verwijderen die deze repo zelf heeft gepubliceerd
          # (packages: write hierboven).
          GH_TOKEN: ${{ github.token }}
          CONTAINER_ORG: ${{ github.repository_owner }}
          CONTAINER_NAME: ${{ github.event.repository.name }}
          TAG_PREFIX: pr-${{ github.event.pull_request.number }}-
        run: |
          echo "Deleting container images with tag prefix: $TAG_PREFIX"
          ENCODED_NAME=$(printf '%s' "$CONTAINER_NAME" | jq -sRr @uri)
          VERSIONS=$(gh api "orgs/$CONTAINER_ORG/packages/container/$ENCODED_NAME/versions" 2>/dev/null \
            | jq -r --arg prefix "$TAG_PREFIX" '.[] | select(.metadata.container.tags[]? | startswith($prefix)) | .id')
          if [ -z "$VERSIONS" ]; then
            echo "No versions found with tag prefix: $TAG_PREFIX (may already be deleted)"
            exit 0
          fi
          DELETED=0
          for ID in $VERSIONS; do
            if gh api "orgs/$CONTAINER_ORG/packages/container/$ENCODED_NAME/versions/$ID" -X DELETE 2>/dev/null; then
              echo "Deleted version: $ID"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete version: $ID"
            fi
          done
          echo "Deleted $DELETED container version(s) for PR ${{ github.event.pull_request.number }}"

  deploy-production:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@0b604742a137d43f6fe8fceb06bdffeb0a1665db # v4.4.1
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: toets-hn7
          deployment-name: production
          component: frontend
          image: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          wait-for-ready: true
