name: Valideer publiccode.yml

on:
  pull_request:
    paths:
      - publiccode.yml
      - .github/workflows/publiccode-validate.yaml
  push:
    branches: [main]
    paths:
      - publiccode.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Installeer publiccode-parser
        run: go install github.com/italia/publiccode-parser-go/v5/publiccode-parser@latest

      - name: Valideer publiccode.yml
        run: publiccode-parser publiccode.yml
