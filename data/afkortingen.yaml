# Afkortingen uit de bronteksten van de voetnoten; `_partials/afkortingen.html`
# wrapt ze in <abbr title="…"> (WCAG 3.1.4, bevinding 28).
#
# In `data/` en niet in `params:`, omdat Hugo configuratiesleutels lowercaset:
# "DUTO" zou dan als "duto" matchen, inclusief het pad `/archiveren/duto` in een
# bronlink.
#
# De match is hoofdlettergevoelig en op heel woord (\b…\b), dus schrijf de
# afkorting in de content net als de sleutel.
Aw: "Archiefwet 2026"
Ab: "Archiefbesluit 2026"
Ar: "Archiefregeling"
DUTO: "Duurzaam Toegankelijke Overheidsinformatie"
SIO: "strategisch informatie overleg"
