baseURL: https://frontend-production-toets-hn7.rig.prd1.gn2.quattro.rijksapps.nl/
locale: nl-NL
defaultContentLanguage: nl
title: Toetsingskader Archiefwet

enableRobotsTXT: true
enableGitInfo: true

# Geen tags of categorieën. Hugo maakte er twee lege taxonomiepagina's voor, met
# een Engelse kop in <html lang="nl"> (3.1.2), zonder beschrijvende titel (2.4.6)
# en wél in sitemap.xml.
disableKinds:
  - taxonomy
  - term

outputFormats:
  # Print-HTML: de invoer waar scripts/pdf-build.mjs met Chromium een getagde
  # PDF van maakt. Alleen aangezet op de normen (front matter van
  # content/normen/_index.md), want alleen die worden als document aangeboden.
  # `notAlternative` houdt het uit de <link rel="alternate"> van de site: het is
  # een tussenproduct, geen tweede versie van de pagina om naartoe te linken.
  print:
    mediaType: text/html
    baseName: index.print
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
  section:
    - HTML

markup:
  goldmark:
    renderer:
      unsafe: false
    extensions:
      table: true
      footnote: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

params:
  # Lokale default; in CI de git-release-tag via HUGO_PARAMS_VERSIE. Ook de bron
  # voor de PDF-export.
  versie: "0.8"
  # Doel van het versienummer. Eén plek: het label staat op de homepage
  # (`versielabel`) én in de paginavoet (`_partials/lastmod.html`).
  releases_url: "https://github.com/RijksICTGilde/toetsingskader-archiefwet/releases"
  feedback:
    email: toetsingskader@inspectie-oe.nl
  search:
    enable: true
    priority_sections:
      - normen
      - onderwerpen
      - samenhang
      - over
      - home
  back_to_top: true
  tagline: "Normen voor duurzame toegankelijkheid"
  footer:
    tagline: "De Inspectie ziet toe op de toegankelijkheid van overheidsinformatie en op de zorgvuldige omgang met erfgoed. Zij kijkt hoe de regels in de praktijk werken."
    links: "Zie ook"
    rechts: "Over deze site"

menus:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Normen
      pageRef: /normen
      weight: 2
    - name: Onderwerpen
      pageRef: /onderwerpen
      weight: 3
    - name: Samenhang
      pageRef: /samenhang
      weight: 4
    - name: Over
      pageRef: /over
      weight: 5

  footer-links:
    - name: Contact
      url: https://www.inspectie-oe.nl/service/contact
      weight: 1
    - name: Terug naar hoofdsite
      url: https://www.inspectie-oe.nl/
      weight: 2

  footer-rechts:
    - name: Privacy
      url: https://www.inspectie-oe.nl/service/privacy
      weight: 2
    - name: Cookies
      url: https://www.inspectie-oe.nl/service/cookies
      weight: 3
    - name: Toegankelijkheid
      url: https://www.inspectie-oe.nl/service/toegankelijkheid
      weight: 4
    - name: Kwetsbaarheid melden
      url: https://www.inspectie-oe.nl/service/kwetsbaarheid-melden
      weight: 5

module:
  imports:
    - path: github.com/RijksICTGilde/hugo-theme-rijksoverheid
